server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
